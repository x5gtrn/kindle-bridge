<!--
  Anonymized fixture approximating an Amazon Kindle notebook
  highlights/notes page for a single book (Global region). Not
  captured from a real account, but the DOM shape (container, hidden
  pagination inputs, per-row `id` + generic `a-row a-spacing-base`
  classes, #kp-annotation-location, #highlight, #note) was confirmed
  against a real, live account on 2026-08-07 - see docs/risks.md R-02.
  Amazon does not expose a page number or a per-annotation created
  date anywhere in this markup (confirmed the same day), so neither is
  covered here. Covers, in order:
    ann-1: highlight only, no note/location
    ann-2: highlight + note + location
    ann-3: note only (freestanding note, no underlying highlight)
    ann-4: whitespace-only highlight and no note - must be filtered out
-->
<!DOCTYPE html>
<html lang="en">
  <body>
    <div id="kp-notebook-annotations">
      <input type="hidden" class="kp-notebook-content-limit-state" value="" />
      <input type="hidden" class="kp-notebook-annotations-next-page-start" value="" />
      <div id="ann-1" class="a-row a-spacing-base">
        <div class="a-column a-span10 kp-notebook-row-separator">
          <div class="a-row">
            <div class="a-column a-span8">
              <span id="annotationHighlightHeader" class="a-size-small a-color-secondary kp-notebook-selectable kp-notebook-metadata">Yellow highlight</span>
            </div>
          </div>
        </div>
        <div class="a-row a-spacing-top-medium">
          <div class="a-column a-span10 a-spacing-small kp-notebook-print-override">
            <div id="highlight-ann-1" class="a-row kp-notebook-highlight kp-notebook-selectable kp-notebook-highlight-yellow">
              <span id="highlight" class="a-size-base-plus a-color-base">Programs must be written for people to read, and only incidentally for machines to execute.</span>
            </div>
            <div id="note-ann-1" class="a-row a-spacing-top-base kp-notebook-note aok-hidden kp-notebook-selectable">
              <span id="note-label" class="a-size-small a-color-secondary"><span class="a-letter-space"></span></span>
              <span id="note" class="a-size-base-plus a-color-base"></span>
            </div>
          </div>
        </div>
      </div>
      <div id="ann-2" class="a-row a-spacing-base">
        <div class="a-column a-span10 kp-notebook-row-separator">
          <div class="a-row">
            <input type="hidden" value="1240" id="kp-annotation-location" />
            <div class="a-column a-span8">
              <span id="annotationHighlightHeader" class="a-size-small a-color-secondary kp-notebook-selectable kp-notebook-metadata">Yellow highlight | Location: 1,240</span>
            </div>
          </div>
        </div>
        <div class="a-row a-spacing-top-medium">
          <div class="a-column a-span10 a-spacing-small kp-notebook-print-override">
            <div id="highlight-ann-2" class="a-row kp-notebook-highlight kp-notebook-selectable kp-notebook-highlight-yellow">
              <span id="highlight" class="a-size-base-plus a-color-base">The best design is the simplest one that works.</span>
            </div>
            <div id="note-ann-2" class="a-row a-spacing-top-base kp-notebook-note kp-notebook-selectable">
              <span id="note-label" class="a-size-small a-color-secondary"><span class="a-letter-space"></span></span>
              <span id="note" class="a-size-base-plus a-color-base">Re-read this before the next design review.</span>
            </div>
          </div>
        </div>
      </div>
      <div id="ann-3" class="a-row a-spacing-base">
        <div class="a-column a-span10 kp-notebook-row-separator">
          <div class="a-row">
            <div class="a-column a-span8">
              <span id="annotationNoteHeader" class="a-size-small a-color-secondary kp-notebook-selectable kp-notebook-metadata">Note</span>
            </div>
          </div>
        </div>
        <div class="a-row a-spacing-top-medium">
          <div class="a-column a-span10 a-spacing-small kp-notebook-print-override">
            <div id="note-ann-3" class="a-row a-spacing-top-base kp-notebook-note kp-notebook-selectable">
              <span id="note-label" class="a-size-small a-color-secondary"><span class="a-letter-space"></span></span>
              <span id="note" class="a-size-base-plus a-color-base">A note without a highlighted passage.</span>
            </div>
          </div>
        </div>
      </div>
      <div id="ann-4" class="a-row a-spacing-base">
        <div class="a-column a-span10 kp-notebook-row-separator">
          <div class="a-row">
            <input type="hidden" value="" id="kp-annotation-location" />
          </div>
        </div>
        <div class="a-row a-spacing-top-medium">
          <div class="a-column a-span10 a-spacing-small kp-notebook-print-override">
            <div id="highlight-ann-4" class="a-row kp-notebook-highlight kp-notebook-selectable kp-notebook-highlight-yellow">
              <span id="highlight" class="a-size-base-plus a-color-base">   </span>
            </div>
            <div id="note-ann-4" class="a-row a-spacing-top-base kp-notebook-note aok-hidden kp-notebook-selectable">
              <span id="note-label" class="a-size-small a-color-secondary"><span class="a-letter-space"></span></span>
              <span id="note" class="a-size-base-plus a-color-base"></span>
            </div>
          </div>
        </div>
      </div>
      <div id="empty-annotations-pane" class="a-row aok-hidden"></div>
    </div>
  </body>
</html>
