name: Release Obsidian plugin

# Runs only when a version tag is pushed (e.g. "1.0.0", matching
# manifest.json's "version" field exactly - no "v" prefix, per
# Obsidian's documented release process). Pushing the tag is a
# separate, deliberate step the maintainer takes; committing this
# workflow file does nothing by itself. See docs/community-plugin-checklist.md.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - run: npm ci

      - run: npm run build

      # Obsidian requires the released manifest.json "version" to match
      # the release tag exactly. Nothing else in the pipeline checks the
      # tag against the manifest (validate-release only cross-checks the
      # in-repo files against each other), so guard it here before any
      # artifact is published. See #7.
      - name: Verify the tag matches manifest.json version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$manifest_version" ]; then
            echo "Tag \"$tag\" does not match manifest.json version \"$manifest_version\"." >&2
            exit 1
          fi

      - run: npm run validate-release

      # Recommended by Obsidian's plugin release docs: a signed build
      # provenance attestation for the release assets. No styles.css
      # is listed since this plugin doesn't ship one - see README.md.
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Create a draft GitHub Release with the plugin's build artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --draft \
            --generate-notes \
            main.js manifest.json
